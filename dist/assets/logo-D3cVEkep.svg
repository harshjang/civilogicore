<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gCyan" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ED6D2"/>
      <stop offset="0.5" stop-color="#1A8FA0"/>
      <stop offset="1" stop-color="#0E2A4A"/>
    </linearGradient>
    <linearGradient id="gDark" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E4D6E"/>
      <stop offset="1" stop-color="#061828"/>
    </linearGradient>
    <linearGradient id="gGlow" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EEEE8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A8B9A" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="256,32 462,128 462,384 256,480 50,384 50,128"/>
    </clipPath>
  </defs>

  <!-- Hexagonal boundary (subtle) -->
  <polygon points="256,32 462,128 462,384 256,480 50,384 50,128" fill="none" stroke="#2ED6D2" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Inner hex ring -->
  <polygon points="256,62 432,145 432,367 256,450 80,367 80,145" fill="none" stroke="#2ED6D2" stroke-width="0.8" opacity="0.12"/>

  <!-- Blueprint grid lines inside hex -->
  <g clip-path="url(#hexClip)" opacity="0.08" stroke="#2ED6D2" stroke-width="0.5">
    <line x1="50" y1="180" x2="462" y2="180"/>
    <line x1="50" y1="256" x2="462" y2="256"/>
    <line x1="50" y1="332" x2="462" y2="332"/>
    <line x1="160" y1="32" x2="160" y2="480"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="352" y1="32" x2="352" y2="480"/>
  </g>

  <!-- Triangulation / geodesic lines -->
  <g opacity="0.15" stroke="#2ED6D2" stroke-width="1">
    <line x1="256" y1="80" x2="120" y2="380"/>
    <line x1="256" y1="80" x2="392" y2="380"/>
    <line x1="120" y1="380" x2="392" y2="380"/>
    <line x1="256" y1="80" x2="256" y2="380"/>
    <line x1="188" y1="230" x2="324" y2="230"/>
    <line x1="154" y1="305" x2="358" y2="305"/>
  </g>

  <!-- === C (left) — built as structural beam/arch === -->
  <g filter="url(#outerGlow)">
    <!-- Outer C arc — thick structural stroke -->
    <path d="M200 168 C160 168, 108 200, 108 256 C108 312, 160 344, 200 344"
      stroke="url(#gCyan)" stroke-width="28" stroke-linecap="square" fill="none"/>
    <!-- Inner parallel beam line -->
    <path d="M190 188 C162 192, 132 216, 132 256 C132 296, 162 320, 190 324"
      stroke="url(#gDark)" stroke-width="8" stroke-linecap="square" fill="none" opacity="0.9"/>
    <!-- Cross-hatch structural detail -->
    <line x1="108" y1="200" x2="132" y2="210" stroke="#2ED6D2" stroke-width="2" opacity="0.5"/>
    <line x1="108" y1="312" x2="132" y2="302" stroke="#2ED6D2" stroke-width="2" opacity="0.5"/>
    <!-- Rivet dots -->
    <circle cx="110" cy="218" r="3" fill="#2ED6D2" opacity="0.7"/>
    <circle cx="110" cy="294" r="3" fill="#2ED6D2" opacity="0.7"/>
  </g>

  <!-- === L (center) — as a right-angle structural column === -->
  <g filter="url(#outerGlow)">
    <!-- Vertical pillar -->
    <rect x="224" y="148" width="28" height="196" rx="2" fill="url(#gCyan)"/>
    <!-- Horizontal base beam -->
    <rect x="224" y="320" width="100" height="24" rx="2" fill="url(#gCyan)"/>
    <!-- Inner structural lines -->
    <rect x="232" y="156" width="12" height="172" rx="1" fill="url(#gDark)" opacity="0.85"/>
    <rect x="248" y="326" width="68" height="10" rx="1" fill="url(#gDark)" opacity="0.85"/>
    <!-- Corner gusset plate triangle -->
    <polygon points="252,320 252,296 276,320" fill="#2ED6D2" opacity="0.3"/>
    <!-- Measurement ticks on vertical -->
    <g stroke="#2ED6D2" stroke-width="1.5" opacity="0.4">
      <line x1="218" y1="168" x2="224" y2="168"/>
      <line x1="218" y1="208" x2="224" y2="208"/>
      <line x1="218" y1="248" x2="224" y2="248"/>
      <line x1="218" y1="288" x2="224" y2="288"/>
    </g>
  </g>

  <!-- === C (right) — mirrored structural arc === -->
  <g filter="url(#outerGlow)">
    <path d="M340 168 C380 168, 418 200, 418 256 C418 312, 380 344, 340 344"
      stroke="url(#gCyan)" stroke-width="28" stroke-linecap="square" fill="none"/>
    <path d="M348 188 C372 192, 394 216, 394 256 C394 296, 372 320, 348 324"
      stroke="url(#gDark)" stroke-width="8" stroke-linecap="square" fill="none" opacity="0.9"/>
    <!-- Cross-hatch -->
    <line x1="418" y1="200" x2="394" y2="210" stroke="#2ED6D2" stroke-width="2" opacity="0.5"/>
    <line x1="418" y1="312" x2="394" y2="302" stroke="#2ED6D2" stroke-width="2" opacity="0.5"/>
    <!-- Rivets -->
    <circle cx="416" cy="218" r="3" fill="#2ED6D2" opacity="0.7"/>
    <circle cx="416" cy="294" r="3" fill="#2ED6D2" opacity="0.7"/>
  </g>

  <!-- Survey/measurement nodes at key intersections -->
  <g filter="url(#innerGlow)">
    <circle cx="256" cy="80" r="4" fill="#2ED6D2" opacity="0.6"/>
    <circle cx="120" cy="380" r="3" fill="#2ED6D2" opacity="0.4"/>
    <circle cx="392" cy="380" r="3" fill="#2ED6D2" opacity="0.4"/>
  </g>

  <!-- Coordinate markers (engineering drawing style) -->
  <g stroke="#2ED6D2" stroke-width="1" opacity="0.25">
    <!-- Top crosshair -->
    <line x1="248" y1="80" x2="264" y2="80"/>
    <line x1="256" y1="72" x2="256" y2="88"/>
    <!-- Bottom left -->
    <line x1="70" y1="420" x2="86" y2="420"/>
    <line x1="78" y1="412" x2="78" y2="428"/>
    <!-- Bottom right -->
    <line x1="426" y1="420" x2="442" y2="420"/>
    <line x1="434" y1="412" x2="434" y2="428"/>
  </g>
</svg>
